<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="200" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-size="18" text-anchor="middle">
    <rect x="30" y="70" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="105" y="106" fill="#1e3a8a">Real data</text>
    <rect x="230" y="70" width="150" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="106" fill="#4c1d95">Generator</text>
    <rect x="430" y="70" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="505" y="106" fill="#14532d">Synthetic data</text>
    <rect x="630" y="70" width="140" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="700" y="106" fill="#78350f">Evaluation</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="180" y1="100" x2="226" y2="100"/>
    <line x1="380" y1="100" x2="426" y2="100"/>
    <line x1="580" y1="100" x2="626" y2="100"/>
  </g>
  <text x="400" y="175" font-size="14" text-anchor="middle" fill="#64748b">A synthetic data pipeline</text>
</svg>
